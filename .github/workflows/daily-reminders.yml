name: Daily reminder check

on:
  workflow_dispatch:        # manual trigger
  schedule:
    # 00:00 UTC = 08:00 in UTC+8
    - cron: '0 0 * * *'

permissions: {}

concurrency:
  group: daily-reminders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder endpoint
        # Both values are secrets, not variables: repository variables are
        # printed in plain text in the run log, which would expose the
        # deployment URL. Secrets are masked.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMINDER_URL: ${{ secrets.REMINDER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${REMINDER_URL:-}" ]; then
            echo "REMINDER_URL repository secret is not set"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET repository secret is not set"
            exit 1
          fi

          RESPONSE=$(curl -sS --fail-with-body -X POST \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            "${REMINDER_URL%/}/api/run")
          echo "Response: ${RESPONSE}"

          echo "## Reminder check result" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "${RESPONSE}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
