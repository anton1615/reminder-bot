name = "reminder-bot"
main = "src/index.js"
compatibility_date = "2026-10-07"
workers_dev = true
preview_urls = false

# Bind a custom domain by uncommenting this and setting your own hostname.
# The zone must be in the same Cloudflare account. Removing this block does
# NOT detach an existing custom domain from the Worker.
# [[routes]]
# pattern = "reminders.example.com"
# custom_domain = true

[observability]
enabled = true

# 00:00 UTC = 08:00 in UTC+8.
# See the "Scheduling notes" section of the README: Cron Triggers can fail to
# activate on newly created or modified schedules, which is why the included
# GitHub Actions workflow is available as a second trigger source. Running
# both is safe, because delivery is idempotent.
[triggers]
crons = ["0 0 * * *"]

# The KV namespace is provisioned automatically on the first deploy: with no
# `id` here, wrangler creates "<worker-name>-<binding>" in your account and
# reuses it on every later deploy. Nothing account-specific is committed.
[[kv_namespaces]]
binding = "REMINDERS"

# Secrets, set with `npx wrangler secret put <NAME>` — never in this file:
#   AUTH_PASSWORD    password for the web UI
#   AUTH_SECRET      random string used to sign session cookies
#   DISCORD_TOKEN    Discord bot token
#   DISCORD_USER_ID  recipient's numeric user ID
#   CRON_SECRET      shared secret for POST /api/run
